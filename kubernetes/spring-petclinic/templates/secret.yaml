
{{- /*
=======================================================================
EXPLANATION OF THE SAFE DICTIONARY FALLBACK:

1. .Values.global.mysql
   This tells Helm to go look inside your values.yaml file and grab 
   the entire mysql dictionary block.

2. | (The Pipe Operator)
   It takes whatever data Helm just grabbed from .Values.global.mysql 
   and "pipes" (or passes) it directly into the next function.

3. default
   It looks at the data coming through the pipe and says:
   - "If this data is valid and actually exists, let it pass through."
   - "If this data is empty, null, or completely missing from the 
      values file, replace it with a fallback value."

4. dict
   Calling dict generates a completely empty dictionary that looks 
   like this: (empty dict).
=======================================================================

EXPLANATION OF THE 'OR' & 'HASKEY' PREFIX NOTATION:

1. hasKey
   A function that checks a dictionary for a specific key. 
   Format: (hasKey dictionaryName "keyName")
   Returns true if the key exists, false if it does not.

2. or
   Helm uses Prefix Notation. Instead of writing (A or B), you write 
   the operator first: or (A) (B). If any argument is true, it returns true.

3. The Logic
   We check: or (has rootPassword) (has userPassword).
   If the developer provided AT LEAST ONE of the passwords, this evaluates 
   to true, signaling that they intend to create the Kubernetes Secret.

*/ -}}



{{- /* 1. Safely grab the mysql block */ -}}
{{- $mysql := .Values.global.mysql | default dict }}

{{- /* 2. Check if the user is attempting to create the secret by providing AT LEAST ONE key */ -}}
{{- if or (hasKey $mysql "rootPassword") (hasKey $mysql "userPassword") }}

  {{- /* 3. Explicitly fail if one is missing! */ -}}
  {{- if not (hasKey $mysql "rootPassword") }}
    {{- fail "FATAL ERROR: You provided userPassword, but forgot global.mysql.rootPassword!" }}
  {{- end }}
  
  {{- if not (hasKey $mysql "userPassword") }}
    {{- fail "FATAL ERROR: You provided rootPassword, but forgot global.mysql.userPassword!" }}
  {{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  labels:
    {{- include "spring-petclinic.labels" . | nindent 4 }}
type: Opaque
data:
  root-pass: {{ $mysql.rootPassword | b64enc | quote }}
  user-pass: {{ $mysql.userPassword | b64enc | quote }}
{{- end }}