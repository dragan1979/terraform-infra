apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        resources:
          requests:
           cpu: 100m
           memory: 256Mi
          limits:
           cpu: 500m 
           memory: 512Mi
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
             - sh
             - -c
             - "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} || exit 1"
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec: 
            command:
             - sh
             - -c
             - "mysql -u root -p${MYSQL_ROOT_PASSWORD} -e 'USE petclinic; SELECT 1;' || exit 1"
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secrets
              key: root-pass
        - name: MYSQL_DATABASE
          value: "petclinic"
        - name: MYSQL_USER
          value: "petclinic"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef: 
              name: mysql-secrets
              key: user-pass
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
      - name: config-server
        image: dragan979/spring-petclinic-microservices-config-server:v1
        ports:
        - containerPort: 8888
        env:
        - name: SPRING_CONFIG_SERVER_PORT
          value: "8888"
        - name: SPRING_PROFILES_ACTIVE
          value: "native"
        - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
          value: "file:/app/shared-config"
        # Mount the "virtual" ConfigMap folder into the container
        volumeMounts:
        - name: config-volume
          mountPath: /app/shared-config
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8888
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8888
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
           cpu: 100m
           memory: 256Mi
          limits:
           cpu: 500m 
           memory: 512Mi
        imagePullPolicy: IfNotPresent

      volumes:
      - name: config-volume
        configMap:
          name: petclinic-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: dragan979/spring-petclinic-microservices-api-gateway:v1
        ports:
        - containerPort: 8080
        env:
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace # This pulls the actual namespace name
        - name: SPRING_CONFIG_IMPORT
          value: "configserver:http://config-server.$(K8S_NAMESPACE).svc.cluster.local:8888"
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
    
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
           cpu: 100m
           memory: 256Mi
          limits:
           cpu: 500m 
           memory: 512Mi
        imagePullPolicy: IfNotPresent

