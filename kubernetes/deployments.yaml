---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customers-service
  template:
    metadata:
      labels:
        app: customers-service
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox
        env:
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        command:
          - sh
          - -c 
          - |
            until nc -vz mysql.$(K8S_NAMESPACE).svc.cluster.local 3306; do
              echo "Waiting for MySQL to be ready..."
              sleep 5
            done
      containers:
      - name: customers-service
        image: dragan979/spring-petclinic-microservices-customers-service:v1 
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_ZIPKIN_ENABLED
          value: "false"
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace # This pulls the actual namespace name
        - name: SPRING_PROFILES_ACTIVE
          value: "docker,mysql"
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-server.$(K8S_NAMESPACE).svc.cluster.local:8888/"
        # Database Connection
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql.$(K8S_NAMESPACE).svc.cluster.local:3306/petclinic"
        # Database Credentials (from the Secrets we created earlier)
        - name: SPRING_DATASOURCE_USERNAME
          value: "petclinic"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secrets
              key: user-pass
    
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 60
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 60
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
           cpu: 100m
           memory: 256Mi
          limits:
           cpu: 500m 
           memory: 512Mi
        imagePullPolicy: IfNotPresent
