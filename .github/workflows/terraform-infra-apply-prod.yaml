name: 'Production Environment: Terraform Apply Infrastructure'
on:
  push:
    branches:
      - production
    # Only trigger this pipeline if files in these specific folders change
    paths:
      - 'terraform/environments/production/01-core-infra/**'
      - 'terraform/modules/**'
permissions:
  id-token: write
  contents: read
  pull-requests: write
 

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  terraform-apply-production:
    name: 'Apply Production'
    runs-on: self-hosted
    defaults:
      run:
        # Force all commands to run exclusively inside the Production deployment folder
        working-directory: ./terraform/environments/production/01-core-infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      
      - name: Terraform Init
        run: terraform init

      # Build the infrastructure without asking for human input
      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color > apply_output.txt
      
      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Terraform Apply Results" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "### Apply Output" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          tail -n 20 apply_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "[View Full Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      # If want to comment on the PR that was JUST merged
      - name: Find Linked Pull Request
        if: github.event_name == 'push'
        uses: jwalton/gh-find-current-pr@v1
        id: findPr
        with:
          state: closed

      - name: Post Success Comment to Closed PR
        if: steps.findPr.outputs.number && success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.findPr.outputs.number }}
          header: infra-ci
          message: |
            ✅ **Infrastructure Successfully Deployed to Production!**
            The merge to `production` has triggered a successful `terraform apply`.
            [View Job Summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})