name: Phase 2 - Bootstrap ArgoCD

on:
  # run manually from the Actions tab in GitHub
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  bootstrap-cluster:

    runs-on: cloud-runner

    steps:
    - uses: actions/checkout@v5

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

    - uses: azure/use-kubelogin@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        kubelogin-version: 'latest'

    - name: Get AKS Cluster Context
      uses: azure/aks-set-context@v3
      with:
        resource-group: aks-resource-group
        cluster-name: petclinic-aks
        use-kubelogin: 'true'

           
    - name: Bootstrap Cluster Infrastructure
      run: |
        # 1. Add all required Helm repositories
        helm repo add argo https://argoproj.github.io/argo-helm
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add traefik https://traefik.github.io/charts
        helm repo add external-secrets https://charts.external-secrets.io
        
        # 2. Update local repo cache
        helm repo update
        
        # 3. Deploy ArgoCD
        helm upgrade --install argocd argo/argo-cd --namespace argocd --create-namespace
        
         # 4. Deploy Prometheus Stack
        # helm upgrade --install prometheus prometheus-community/kube-prometheus-stack --namespace monitoring --create-namespace
        
        # 5. Deploy Traefik
        helm upgrade --install traefik traefik/traefik --namespace traefik --create-namespace
        
        # 6. Deploy External Secrets Operator (ESO)
        helm upgrade --install external-secrets external-secrets/external-secrets --namespace external-secrets --create-namespace --set installCRDs=true

        # 7. Deploy Cert-Manager
        helm upgrade --install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set installCRDs=true