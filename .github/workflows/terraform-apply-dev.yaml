name: 'Dev Environment: Terraform Apply'
on:
  push:
    branches:
      - develop
    # Only trigger this pipeline if files in these specific folders change
    paths:
      - 'terraform/environments/dev/**'
      - 'terraform/modules/**'
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  terraform-apply-dev:
    name: 'Apply Dev'
    runs-on: self-hosted
    defaults:
      run:
        # Force all commands to run exclusively inside the Dev deployment folder
        working-directory: ./terraform/environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      
      - name: Terraform Init
        run: terraform init

      # Build the infrastructure without asking for human input
      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color > apply_output.txt
      
      - name: Get Terraform Output
        id: tf-output
        run: |
          # Assuming you just ran 'terraform apply'
          CLIENT_ID=$(terraform output -raw petclinic_identity_client_id)
          echo "CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV

      - name: Generate Cross-Repo Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: dragan-actions-course
          # Tightly scope the token to only access the GitOps repo
          repositories: petclinic-gitops-repo

      - name: Update GitOps Repository
        run: |
          # 1. Clone the Phase 2 repo using the generated App token
          git clone https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/dragan-actions-course/petclinic-gitops-repo.git gitops-repo
          
          cd gitops-repo
          
          # 2. Swap out the placeholder in your kustomization.yaml file
          sed -i "s/REPLACE_ME_CLIENT_ID/${{ env.CLIENT_ID }}/g" apps/petclinic/kustomization.yaml
          
          # 3. Configure the robotic Git user
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 4. Commit and push the changes
          git add apps/petclinic/kustomization.yaml
          git commit -m "chore: update azure workload identity client-id from terraform"
          git push origin main

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Terraform Apply Results" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "### Apply Output" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          tail -n 20 apply_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "[View Full Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      # OPTIONAL: If you want to comment on the PR that was JUST merged
      - name: Find Linked Pull Request
        if: github.event_name == 'push'
        uses: jwalton/gh-find-current-pr@v1
        id: findPr
        with:
          state: closed

      - name: Post Success Comment to Closed PR
        if: steps.findPr.outputs.number && success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.findPr.outputs.number }}
          header: infra-ci
          message: |
            ✅ **Infrastructure Successfully Deployed to Develop!**
            The merge to `develop` has triggered a successful `terraform apply`.
            [View Job Summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
