name: 'Prod Environment: Terraform Apply'
on:
  push:
    branches:
      - main
    # Only trigger this pipeline if files in these specific folders change
    paths:
      - 'terraform/environments/prod/**'
      - 'terraform/modules/**'
permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  terraform-apply-prod:
    name: 'Apply Prod'
    runs-on: self-hosted
    defaults:
      run:
        # Force all commands to run exclusively inside the Prod deployment folder
        working-directory: ./terraform/environments/prod/01-core-infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      
      - name: Terraform Init
        run: terraform init

      # Build the infrastructure without asking for human input
      - name: Terraform Apply
        run: terraform apply -auto-approve- name: Get Terraform Output
        id: tf-output
        run: |
          # Assuming you just ran 'terraform apply'
          CLIENT_ID=$(terraform output -raw petclinic_identity_client_id)
          echo "CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV

      - name: Get Terraform Output
        id: tf-output
        run: |
          # Assuming you just ran 'terraform apply'
          CLIENT_ID=$(terraform output -raw petclinic_identity_client_id)
          echo "CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV

      - name: Generate Cross-Repo Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: dragan-actions-course
          # Tightly scope the token to only access the GitOps repo
          repositories: petclinic-gitops-repo

      - name: Update GitOps Repository
        run: |
          # 1. Clone the Phase 2 repo using the generated App token
          git clone https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/dragan-actions-course/petclinic-gitops-repo.git gitops-repo
          
          cd gitops-repo
          
          # 2. Swap out the placeholder in your kustomization.yaml file
          sed -i "s/REPLACE_ME_CLIENT_ID/${{ env.CLIENT_ID }}/g" apps/petclinic/kustomization.yaml
          
          # 3. Configure the robotic Git user
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 4. Commit and push the changes
          git add apps/petclinic/kustomization.yaml
          git commit -m "chore: update azure workload identity client-id from terraform"
          git push origin main

      

       # Add a comment to the PR with the results of the Terraform apply.
      
      - name: Post Sticky PR Comment (Success)
        uses: marocchino/sticky-pull-request-comment@v2
        if: success()
        with:
          header: infra-ci   # The hidden tag used to find and overwrite the comment
          message: |
            ✅ **Infrastructure CI Passed!**
            
            Results of the Terraform apply have been posted successfully to prod environment.
            [Click here to view the Actions log and details of the apply](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Post Sticky PR Comment (Failure)
        uses: marocchino/sticky-pull-request-comment@v2
        if: failure()
        with:
          header: infra-ci   # Must match the header above exactly!
          message: |
            ❌ **Infrastructure CI Failed!**
            
            The pipeline encountered an error during the Terraform apply to the prod environment.
            [Click here to view the Actions log and find the error](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
